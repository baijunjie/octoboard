# A custom permission for the app's own exit-flow commands. App-defined commands, unlike plugin
# commands, have no auto-generated ACL entry, so the capability that grants them needs this file to
# point at.
"$schema" = "./schemas/schema.json"

[[permission]]
identifier = "allow-exit-lifecycle"
description = "Allows the frontend to register as the exit-flow handler and to confirm an already-approved quit."
commands.allow = ["frontend_handles_exit", "confirm_quit"]
