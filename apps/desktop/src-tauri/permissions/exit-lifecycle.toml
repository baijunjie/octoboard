# A custom permission for the app's own exit-flow commands. App-defined commands, unlike plugin
# commands, have no auto-generated ACL entry, so the capability that grants them needs this file to
# point at.
"$schema" = "./schemas/schema.json"

[[permission]]
identifier = "allow-exit-lifecycle"
description = "Allows the frontend to register as the exit-flow handler (and ping its liveness thereafter), to ask how the daemon ended once the shell has given up on it, and to confirm an already-approved quit."
commands.allow = ["frontend_exit_heartbeat", "daemon_exit_detail", "confirm_quit"]
