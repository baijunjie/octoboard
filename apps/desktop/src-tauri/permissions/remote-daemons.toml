# A custom permission for the app's own commands that keep the remote daemons the owner has added and
# connect to one over SSH, opening its window; see `exit-lifecycle.toml` for why an app-defined command
# needs a file like this.
"$schema" = "./schemas/schema.json"

[[permission]]
identifier = "allow-remote-daemons"
description = "Allows the local daemon's window to list, save and remove the remote daemons the owner has added, to turn this device's key on or off for one, to connect to one over SSH (a password or passphrase goes in; nothing secret comes out: the browser's address with the owner key is opened by the shell, and device keys stay in the credential store), to read how each held connection is connected, to end one, to show its own window, and to take what a connection asked for elsewhere left the Remote devices page to show, and a request for the page."
commands.allow = ["remote_daemons_list", "remote_daemon_save", "remote_daemon_remove", "remote_daemon_device_key_set", "remote_daemon_connect", "remote_daemons_status", "remote_daemon_disconnect", "remote_connect_pending_take", "remote_page_requested_take", "main_window_show"]
