# A custom permission for the app's own commands that keep the remote daemons the owner has added and
# connect to one over SSH, opening its window; see `exit-lifecycle.toml` for why an app-defined command
# needs a file like this.
"$schema" = "./schemas/schema.json"

[[permission]]
identifier = "allow-remote-daemons"
description = "Allows any window of the application (the local daemon's, a remote daemon's, or one on the connect page) to list, save and remove the remote daemons the owner has added, to connect to one over SSH (a password or passphrase goes in; nothing secret comes out: the browser's address with the owner key is opened by the shell, and device keys stay in the credential store), to read how each held connection is connected, to end one, and to open a new remote window, a saved remote daemon's window or the local one."
commands.allow = ["remote_daemons_list", "remote_daemon_save", "remote_daemon_remove", "remote_daemon_connect", "remote_daemons_status", "remote_daemon_disconnect", "remote_window_new", "remote_window_open", "main_window_show"]
