# A custom permission for the app's own keep-awake command; see `exit-lifecycle.toml` for why an
# app-defined command needs a file like this.
"$schema" = "./schemas/schema.json"

[[permission]]
identifier = "allow-set-keep-awake"
description = "Allows the frontend to say whether the app holds the computer and its display awake."
commands.allow = ["set_keep_awake"]
