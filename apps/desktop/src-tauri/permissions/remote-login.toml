# A custom permission for the app's own commands that read whether the computer's SSH server (macOS
# Remote Login, Windows OpenSSH Server) is on and open the system's settings where it is turned on; see `exit-lifecycle.toml` for why an app-defined command
# needs a file like this.
"$schema" = "./schemas/schema.json"

[[permission]]
identifier = "allow-remote-login"
description = "Allows the frontend to read whether the computer's SSH server (macOS Remote Login, Windows OpenSSH Server) is on, and to open the system's settings where it is turned on (System Settings > General > Sharing on macOS, Settings > Optional features on Windows), for the Remote access section of Settings."
commands.allow = ["remote_login_status", "open_remote_login_settings"]
