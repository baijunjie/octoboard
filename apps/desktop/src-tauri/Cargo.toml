[package]
name = "octoboard"
version = "0.1.0"
description = "Octoboard desktop application: spawns octoboardd as a sidecar and hands its window the daemon's port. Talks to the daemon only over WebSocket — this crate carries no daemon traffic or session state."
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
serde_json = "1"

[dependencies]
# `macos-private-api` is what lets the window be transparent on macOS, which the native sidebar
# material behind the page needs (`open_main_window` in `src/lib.rs`); `app.macOSPrivateApi` in
# `tauri.conf.json` has to say the same, or `tauri-build` refuses the pair. The private API rules out
# Mac App Store distribution; the app ships as a notarized DMG. `image-png` is what lets `Image::from_bytes`
# decode the PNG icons the UI hands over for the tray menu's lines (`tray.rs`).
#
# The tilde requirement holds the release line to the `@tauri-apps/api` the UI pins: the
# Tauri CLI refuses to build when a crate and its NPM package differ in major or minor version. The
# plugins below that have an NPM package in the UI are held the same way.
tauri = { version = "~2.12.4", features = ["tray-icon", "macos-private-api", "image-png"] }
# Held to the UI's `@tauri-apps/plugin-shell` release line like `tauri` above. The UI opens a Markdown
# link through its `open` command (`links` in `packages/ui/src/platform/tauri.ts`), and a platform
# whose command does not resolve silently shows links as plain text.
tauri-plugin-shell = "~2.5.0"
tauri-plugin-notification = "~2.7.0"
tauri-plugin-clipboard-manager = "~2.5.0"
# The system's save and open dialogs, raised from `configuration_file.rs` for the configuration export and import.
tauri-plugin-dialog = "2.8"
anyhow = "1"
# Decodes the tray menu's icons, which the UI sends as base64 PNGs (`tray.rs`). The release line
# `tauri` and the daemon already resolve, so the workspace builds it once.
base64 = "0.22"
# For the saved window state in `window_state.rs`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Draws the menu bar icon's canvases and encodes them as PNG (`tray_icon.rs`). Only the PNG codec:
# the crate's defaults pull a whole codec set (AV1 encoding among it) the icon never uses.
image = { version = "0.25", default-features = false, features = ["png"] }
# For the `applicationShouldTerminate:` override in `exit.rs` that catches the Dock icon's own Quit
# (see the comment there), in `background.rs` for hiding and unhiding the app, the Dock badge, the
# window's Cmd+H and the notification that the app became active, in `permissions.rs` for the System
# Settings deep link `NSWorkspace` opens, and in `tray.rs` for the notifications that a menu began
# and ended tracking, the template flag on the tray menu's pictures and the view that draws the menu
# bar icon's raised hand over its status item's button, and in `tray_lines.rs` for the views of the
# menu's rows (`NSImageView` for a section heading's picture). Pinned to the exact versions already
# resolved transitively through `tauri-runtime-wry`, so promoting them to direct dependencies does
# not shift anything else this crate depends on.
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAccessibilityProtocols", "NSApplication", "NSAttributedString", "NSBezierPath", "NSButton", "NSColor", "NSCell", "NSControl", "NSDockTile", "NSFont", "NSGraphics", "NSImage", "NSImageView", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSStringDrawing", "NSTextAttachment", "block2", "NSView", "NSWindow", "NSWorkspace", "objc2-core-foundation"] }
# For the system's preferred languages in `lib.rs`, the notification observers in `background.rs`
# and `tray.rs` (and the main queue the latter applies a held menu on, and the bytes of the raised
# hand's picture), the content rule list in `page_isolation.rs`, and in `permissions.rs` the
# Accessibility prompt's options dictionary and the System Settings URL, pinned like `objc2-app-kit`
# above.
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSAttributedString", "NSData", "NSDictionary", "NSGeometry", "NSLocale", "NSNotification", "NSOperation", "NSString", "NSURL", "NSValue"] }
# For the content rule list `page_isolation.rs` puts on the window's webview, and the block its
# compile reports back through; `WebviewWindowBuilder::with_webview_configuration` takes this
# crate's type. Pinned like `objc2-app-kit` above, `block2` to the version already resolved
# through `objc2-web-kit`.
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "WKWebViewConfiguration"] }
block2 = "=0.6.2"
