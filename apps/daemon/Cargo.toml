[package]
name = "octoboardd"
version.workspace = true
description = "Octoboard daemon: host role (PTYs, agent processes, repositories) and coordinator role (console / project / session data)."
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "octoboardd"
path = "src/main.rs"

# Embeds the UI build (`packages/ui/dist`) in the binary and serves it (`src/server/ui.rs`), the server
# form's way in for a browser. The desktop form's sidecar is built without it: its window loads the
# UI the shell bundles. Build it through the workspace package, which builds the UI first:
# `pnpm --filter @octoboard/daemon... build`.
[features]
embedded-ui = []

[build-dependencies]
serde_json = "1"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a report panel form's field order is the author's reading order, and
# `render_page_submission` renders a submitted object's fields in iteration order straight into
# the console session's prose — without this, `serde_json::Map` is a `BTreeMap` and the fields would arrive
# alphabetised instead.
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
# A continuously parsed screen for archived previews.
alacritty_terminal = { version = "0.26", default-features = false }
# Encodes a binary file body for the JSON control socket; the version the lockfile already
# resolves for other dependencies.
base64 = "0.22"
# Derives the file name Claude Code caches an account's model catalogue under; the version the
# lockfile already resolves for other dependencies.
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures-util = { version = "0.3", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
rmcp = { version = "3.5", features = ["server", "transport-io"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "display", "serde"] }
# Format-preserving edits of a shared Grok `config.toml`. The `toml` crate above parses and
# compares; it does not keep comments.
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }
trash = "5"
# Reads a Codex rollout it has compressed (`rollout-….jsonl.zst`). The bindings to the C library
# are what the project already builds for SQLite, and a decoder-only crate would add a second
# implementation of a format Codex itself writes with the reference one.
zstd = { version = "0.13", default-features = false }
# The WebSocket client of the daemon's link to a holder (`crate::holder::client`) and of a Codex
# session's private app server, also what the tests that drive the control socket end to end connect
# with; the version axum's own server side already resolves, with only the client handshake added.
tokio-tungstenite = { version = "=0.24.0", default-features = false, features = ["connect"] }
# Watches each repository's refs for a commit made outside the daemon (`crate::project_git::watch`).
notify = "8.2"
# Reads the latest published version of an agent CLI from the npm registry (`crate::agents::cli`), the
# only HTTP the daemon makes. Blocking, with rustls (no OpenSSL), the system's certificate store as
# its roots (`platform-verifier`; the bundled web roots `rustls` brings along are not used) and
# SOCKS proxies, which the user's shell may name (`ALL_PROXY=socks5://...`): without
# `socks-proxy` ureq panics at connect on one.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "socks-proxy"] }
# Compiles a report page's text field `pattern` with ECMAScript's syntax, which the panel tests it
# with as a JavaScript regular expression, to refuse one that does not compile when the page is
# pushed (`crate::protocol::page_content`). The `regex` crate's syntax differs from JavaScript's.
regress = "0.12"

# The platform layer's Unix modules (`src/platform`), the PTY backend of `platform::term` among
# them.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
portable-pty = "0.8"

# The Linux hold on sleep (`platform::sleep`): logind's inhibitor lock over D-Bus. Pure Rust, with
# blocking calls; the version the lockfile already resolves for other dependencies.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# The platform layer's Windows modules; the version the lockfile already resolves for other
# dependencies.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Paused time for tests that would otherwise wait out a real timeout.
tokio = { version = "1", features = ["full", "test-util"] }

# Renders the wire types as TypeScript for the contract test (`protocol::bindings`); test builds
# only, so the release binary carries nothing of it.
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }

# Renders the wire types as JSON Schema for the schema contract test (`protocol::schema`), the
# language-neutral description in `contracts/protocol/`; test builds only, like `ts-rs`. The version
# the lockfile already resolves for other dependencies.
schemars = "=1.2.2"
