[package]
name = "octoboardd"
version = "0.1.0"
description = "Octoboard daemon: host role (PTYs, agent processes, repositories) and coordinator role (console / project / session data)."
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "octoboardd"
path = "src/main.rs"

[build-dependencies]
# The same exact pin as the desktop crate's build script, for the one shared workspace resolution.
serde_json = "=1.0.151"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a report panel form's field order is the author's reading order, and
# `render_page_submission` renders a submitted object's fields in iteration order straight into
# the console session's prose — without this, `serde_json::Map` is a `BTreeMap` and the fields would arrive
# alphabetised instead.
# The exact version is the Tauri crate's: both crates are members of one Cargo workspace, and that
# one pins `serde_json` exactly to stay within the project's Rust floor.
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
futures-util = { version = "0.3", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
# Pinned exactly, and low: every release above this one fails to compile on the project's Rust
# floor — 1.x and 2.x use let-chains, and 2.x pulls `darling` 0.23, which needs 1.88. A declared
# `rust-version` is no guide either way: 2.2.0 claims 1.86 and does not build on it. The usable
# version is found by compiling, not by reading manifests.
rmcp = { version = "=0.9.1", features = ["server", "transport-io"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "display", "serde"] }
