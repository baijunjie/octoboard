[package]
name = "octoboardd"
version = "0.1.0"
description = "Octoboard daemon: host role (PTYs, agent processes, repositories) and coordinator role (console / project / session data)."
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "octoboardd"
path = "src/main.rs"

[build-dependencies]
serde_json = "1"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a report panel form's field order is the author's reading order, and
# `render_page_submission` renders a submitted object's fields in iteration order straight into
# the console session's prose — without this, `serde_json::Map` is a `BTreeMap` and the fields would arrive
# alphabetised instead.
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
# A continuously parsed screen for archived previews.
alacritty_terminal = { version = "0.26", default-features = false }
# Encodes a binary file body for the JSON control socket; the version the lockfile already
# resolves for other dependencies.
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
futures-util = { version = "0.3", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
rmcp = { version = "3.5", features = ["server", "transport-io"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "display", "serde"] }
# Format-preserving edits of a shared Grok `config.toml`. The `toml` crate above parses and
# compares; it does not keep comments.
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }
trash = "5"
# Reads a Codex rollout it has compressed (`rollout-….jsonl.zst`). The bindings to the C library
# are what the project already builds for SQLite, and a decoder-only crate would add a second
# implementation of a format Codex itself writes with the reference one.
zstd = { version = "0.13", default-features = false }
# Watches each repository's refs for a commit made outside the daemon (`crate::git_watch`).
notify = "8.2"

# The private Codex app-server transport and control-socket tests share axum's resolved protocol.
tokio-tungstenite = { version = "=0.24.0", default-features = false, features = ["connect"] }

[dev-dependencies]
# Paused time for tests that would otherwise wait out a real timeout.
tokio = { version = "1", features = ["full", "test-util"] }
