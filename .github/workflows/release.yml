name: Release

# Pushing an annotated tag `v<version>` builds, signs, notarizes and publishes that version, once the application
# checks have passed. The tag's message is the release notes, which the in-app update notice shows too. What runs is
# `pnpm release` and `publish-release`, as on a Mac by hand (apps/desktop/README.md's "Release builds" and "In-app
# updates and publishing a release" sections); this workflow only supplies their credentials from the repository's
# secrets.
on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

# One release at a time across tags: `publish-release` reads the channel manifests and then writes them, and two
# releases interleaving could move a channel backwards. GitHub keeps one pending run per group, so a third tag pushed
# while one runs and one waits replaces the waiting one, which then has to be re-run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The checks a bad tag or a missing secret would otherwise fail only after the full checks, or the build and
  # notarization: a missing signing identity would make an unsigned build, refused only at publishing.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check the tag and the secrets
        env:
          TAG: ${{ github.ref_name }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          sh .github/release-notes.sh "$TAG" > /dev/null
          # Only what has landed on main is released.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is on a commit that is not on main. Merge it into main and tag it there."
            exit 1
          fi
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY \
            APPLE_API_ISSUER APPLE_API_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These repository secrets are not set:$missing. See apps/desktop/README.md."
            exit 1
          fi
      # The release builds `--locked`; a `Cargo.lock` that no longer matches the manifests would otherwise fail only
      # once the full checks have run and the build has started.
      - run: rustup toolchain install
      - name: Check that Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

  checks:
    needs: validate
    uses: ./.github/workflows/quality.yml

  release:
    needs: checks
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: sh .github/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      # The layered app icon needs Xcode 26's `actool`, which the build would only find missing at its end.
      - name: Check the Xcode version
        run: |
          major=$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')
          if [ -z "$major" ] || [ "$major" -lt 26 ]; then
            echo "::error::The selected Xcode is $(xcodebuild -version | head -n 1), and the build needs Xcode 26."
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      # A keychain of this run's own holds the Developer ID certificate, and the G2 intermediate without which the
      # chain cannot be built (see .env.secret.example).
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Write the App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign and notarize
        env:
          # Apply the Finder background and icon layout on the macOS release runner.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @octoboard/desktop release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter @octoboard/desktop publish-release --notes-file "$RUNNER_TEMP/notes.md"
      - name: Remove the credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
