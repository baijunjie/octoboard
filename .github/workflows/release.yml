name: Release

# Pushing an annotated tag `desktop-v<version>` builds, signs, notarizes and publishes that version for every platform
# (macOS, Windows and Linux), or for the ones a last line such as `Platforms: macos` or `Platforms: macos,linux` of the
# tag's message selects. Running the workflow by hand releases an existing tag the same way, for the platform(s) its
# `platforms` input names: how a platform that a version's tag left out is added later. Application checks run locally
# before tagging. The tag's message is the release notes, which the in-app update notice shows too.
# The builds run in parallel, each only for a selected platform: `macos` builds, signs and notarizes the universal
# build; the Windows build makes the x64 installer and code-signs it as the repository variable `WINDOWS_SIGNING` says
# (none, command or signpath; unset is none), in the one job `windows` for none and command and in the
# `windows-signpath-*` jobs for signpath; `linux` builds the daemon on its own with the UI inside it, statically linked,
# on a runner of each architecture. Each uploads its output as an artifact. With Linux selected, `linux-daemon` lints
# the daemon and runs its tests on Linux (`linux-daemon.yml`) meanwhile. `sign` runs once every selected platform's
# build and those checks have succeeded (an unselected, skipped one does not stop it, a failed selected one does): on a
# fresh runner it signs the update files the builds uploaded with the update key, and `publish` checks each signature
# against the update key's public key and publishes. What runs is `pnpm release --no-sign-update` and
# `publish-release`, as by hand (apps/desktop/scripts/README.md's "Release builds" and "Publishing a release" sections),
# and `tauri signer sign` in place of `sign-update`; this workflow only supplies their credentials.
#
# The update key signs the desktop updates and the daemon's self-updates, so no job that runs the workspace's code holds
# it: a build runs every dependency's install and build scripts, which could rewrite what a later step of the same
# runner runs or outlive their step and read its environment. Only `sign` has the key, from the secrets of the
# `release-signing` environment (whose required reviewers approve each run's signing), and it installs nothing but the
# Tauri CLI, pinned with its integrity in `.github/signer/package-lock.json` and installed without install scripts; it
# runs no build and no workspace script. The repository must hold no secret of the key's name: one would stand in for
# the environment's and be readable by any workflow. `publish` holds only the workflow's own token, with the rights to
# attest the build provenance of what it publishes (`gh attestation verify`), which adds to the minisign signatures and
# replaces none. Once the release is published, `website` starts the website's deployment, which reads the new
# version's downloads from the manifests.
on:
  push:
    tags:
      - "desktop-v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The version tag to release, such as desktop-v0.1.0"
        required: true
        type: string
      platforms:
        description: "The platforms to build and publish"
        required: true
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
        default: all

env:
  # The tag the run releases, whichever way it started.
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

# One release at a time across tags: `publish-release` reads the channel manifests and then writes them, and two
# releases interleaving could move a channel backwards. GitHub keeps one pending run per group, so a third run started
# while one runs and one waits replaces the waiting one, which then has to be re-run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The checks a bad tag or a missing secret would otherwise fail only after the build and
  # notarization: a missing signing identity would make an unsigned build, refused only at publishing.
  validate:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
      # The Windows signing mode, `none` when the variable is unset, which picks the Windows jobs.
      windows_signing: ${{ steps.platforms.outputs.windows_signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      # `.github/release-notes.sh` reads the version and the tag message with Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Such as `macos` or `macos,windows,linux`: the input of a manual run, else the tag message's `Platforms:` line.
      # Also the Windows signing mode, which the next step checks.
      - name: Read the platforms
        id: platforms
        env:
          SELECTION: ${{ inputs.platforms }}
          WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING }}
        run: |
          echo "windows_signing=${WINDOWS_SIGNING:-none}" >> "$GITHUB_OUTPUT"
          case "$SELECTION" in
            "") platforms=$(sh .github/release-notes.sh "$TAG" --platforms) ;;
            all) platforms=macos,windows,linux ;;
            macos | windows | linux) platforms=$SELECTION ;;
            *)
              echo "::error::The platforms input is \"$SELECTION\"; it is all, macos, windows or linux."
              exit 1
              ;;
          esac
          echo "Releasing $TAG for $platforms"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
      - name: Check the tag and the secrets
        env:
          PLATFORMS: ${{ steps.platforms.outputs.platforms }}
          # Only whether each secret is set reaches the step, never its value.
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY != '' }}
          # The Windows code-signing mode and what it needs; variables are not secret, but are passed the same way.
          WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING }}
          HAS_WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND != '' }}
          HAS_SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          HAS_SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
          HAS_SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
          HAS_SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
          HAS_SIGNPATH_BINARIES_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_BINARIES_CONFIGURATION_SLUG != '' }}
          HAS_SIGNPATH_INSTALLER_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION_SLUG != '' }}
        run: |
          sh .github/release-notes.sh "$TAG" > /dev/null
          # Only what has landed on main is released.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is on a commit that is not on main. Merge it into main and tag it there."
            exit 1
          fi
          # The update key is a secret of the `release-signing` environment, which this job cannot see; `sign` checks
          # it. Only the selected platforms need their own credentials.
          needed=""
          case ",$PLATFORMS," in
            *,macos,*) needed="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY" ;;
          esac
          missing=""
          for name in $needed; do
            if [ "$(printenv "HAS_$name")" != "true" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These repository secrets are not set:$missing. See the \"Releasing by tag\" section of apps/desktop/scripts/README.md."
            exit 1
          fi
          needed=""
          case ",$PLATFORMS," in
            *,windows,*)
              case "${WINDOWS_SIGNING:-none}" in
                none) needed="" ;;
                command) needed="WINDOWS_SIGN_COMMAND" ;;
                signpath) needed="SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY_SLUG SIGNPATH_BINARIES_CONFIGURATION_SLUG SIGNPATH_INSTALLER_CONFIGURATION_SLUG" ;;
                *)
                  echo "::error::The repository variable WINDOWS_SIGNING is \"$WINDOWS_SIGNING\"; it is none, command or signpath."
                  exit 1
                  ;;
              esac
              ;;
          esac
          missing=""
          for name in $needed; do
            if [ "$(printenv "HAS_$name")" != "true" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::WINDOWS_SIGNING=$WINDOWS_SIGNING needs these repository secrets or variables, which are not set:$missing. See the \"Releasing by tag\" section of apps/desktop/scripts/README.md."
            exit 1
          fi
      # The release builds `--locked`; a `Cargo.lock` that no longer matches the manifests would otherwise fail only
      # once the build has started.
      - run: rustup toolchain install
      - name: Check that Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

  # The x64 installer for `none` and `command`, built on its own runner, in parallel with the macOS build. `sign` signs
  # the update from the artifact and `publish` takes the installer from it.
  windows:
    needs: validate
    if: contains(needs.validate.outputs.platforms, 'windows') && needs.validate.outputs.windows_signing != 'signpath'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      WINDOWS_SIGNING: ${{ needs.validate.outputs.windows_signing }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: rustup toolchain install
      - uses: ./.github/actions/rust-cache
        with:
          profile: windows-release
      - run: pnpm install --frozen-lockfile
      # `none` and `command` are one build; `command` signs every file the bundler bundles by calling the command
      # line in the variable `WINDOWS_SIGN_COMMAND`. A provider's own credentials are added to this step's `env`
      # when one is chosen.
      - name: Build and sign
        env:
          WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
        run: pnpm --filter @octoboard/desktop release --no-sign-update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # `signpath`: SignPath signs only uploaded artifacts, and each of its two requests waits for an approval given by
  # hand, which can take longer than the six hours a GitHub-hosted job may run. So the route is five jobs, each well
  # under that, passing artifacts on: build the executables, have SignPath sign them, bundle the installer from them,
  # have SignPath sign that, then finish it (`sign` signs the update, as for the other routes). The waits run on Linux,
  # where nothing is built. The bundling job builds the tree the bundler reads again, from the same commit, rather than
  # carrying it over: the signed executables then replace the ones it built.
  windows-signpath-build:
    needs: validate
    if: contains(needs.validate.outputs.platforms, 'windows') && needs.validate.outputs.windows_signing == 'signpath'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      WINDOWS_SIGNING: signpath
    defaults:
      run:
        shell: bash
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: rustup toolchain install
      - uses: ./.github/actions/rust-cache
        with:
          profile: windows-release
      - run: pnpm install --frozen-lockfile
      - name: Build the executables
        run: pnpm --filter @octoboard/desktop release --stage build --no-sign-update
      - name: Upload the executables
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-binaries
          path: target/signpath/binaries/*
          if-no-files-found: error

  # The request's wait is capped at four hours (`wait-for-completion-timeout-in-seconds`), inside the job's own limit.
  # SignPath reads the artifact and this run's details with the job's token, hence `actions: read`.
  windows-signpath-sign-binaries:
    needs: windows-signpath-build
    runs-on: ubuntu-latest
    timeout-minutes: 270
    permissions:
      contents: read
      actions: read
    steps:
      - name: Sign the executables
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_BINARIES_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.windows-signpath-build.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed-binaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-binaries
          path: signed-binaries/*
          if-no-files-found: error

  # Builds the tree again and bundles the installer from the signed executables. The installer goes to SignPath as
  # `unsigned-installer`, and once more under the name the bundler gave it, which the finishing job puts the signed
  # one under.
  windows-signpath-bundle:
    needs: windows-signpath-sign-binaries
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      WINDOWS_SIGNING: signpath
    defaults:
      run:
        shell: bash
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: rustup toolchain install
      - uses: ./.github/actions/rust-cache
        with:
          profile: windows-release
      - run: pnpm install --frozen-lockfile
      - name: Build the executables again
        run: pnpm --filter @octoboard/desktop release --stage build --no-sign-update
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-binaries
          path: target/signpath/signed-binaries
      - name: Bundle the installer
        run: pnpm --filter @octoboard/desktop release --stage bundle --signed target/signpath/signed-binaries --no-sign-update
      - name: Upload the installer
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: target/signpath/installer/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-nsis
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  windows-signpath-sign-installer:
    needs: windows-signpath-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 270
    permissions:
      contents: read
      actions: read
    steps:
      - name: Sign the installer
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.windows-signpath-bundle.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed-installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-installer
          path: signed-installer/*
          if-no-files-found: error

  # Puts the signed installer in the bundle directory under the bundler's name and checks it against the ConPTY files
  # fetched again.
  windows-signpath-finish:
    needs: windows-signpath-sign-installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_SIGNING: signpath
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the ConPTY files the installer is checked against
        run: node scripts/fetch-conpty.mjs --installer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-nsis
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-installer
          path: target/signpath/signed-installer
      - name: Finish the installer
        run: pnpm --filter @octoboard/desktop release --stage finish --signed target/signpath/signed-installer --no-sign-update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # The universal build, signed and notarized, on its own runner, in parallel with the Windows build. `publish` takes
  # it from the artifact, and its macOS tools check the disk image there; `sign` signs the update archive, uploaded on
  # its own as well.
  macos:
    needs: validate
    if: contains(needs.validate.outputs.platforms, 'macos')
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      # No credential stays in `.git/config` for the build to read: nothing after this step pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # The layered app icon needs Xcode 26's `actool`, which the build would only find missing at its end.
      - name: Check the Xcode version
        run: |
          major=$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')
          if [ -z "$major" ] || [ "$major" -lt 26 ]; then
            echo "::error::The selected Xcode is $(xcodebuild -version | head -n 1), and the build needs Xcode 26."
            exit 1
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: rustup toolchain install
      - uses: ./.github/actions/rust-cache
        with:
          profile: release
      - run: pnpm install --frozen-lockfile
      # A keychain of this run's own holds the Developer ID certificate, and the G2 intermediate without which the
      # chain cannot be built (see .env.secret.example).
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Write the App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      # `--no-sign-update` leaves the update archive unsigned, for `sign`.
      - name: Build, sign and notarize
        env:
          # Apply the Finder background and icon layout on the macOS release runner.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: /usr/bin/time -l pnpm --filter @octoboard/desktop release --no-sign-update
      # The Apple credentials are not needed past the build; the later steps run without them on the disk.
      - name: Remove the Apple credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
      # One tar keeps what the publishing looks at (the `.app` the version is read from, the disk image and the update
      # archive) as built, symlinks, permissions and modification times included, which an artifact's zip would not.
      - name: Pack the signed build
        run: tar -C target/universal-apple-darwin/release -cf "$RUNNER_TEMP/macos-bundle.tar" bundle/macos bundle/dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-bundle
          path: ${{ runner.temp }}/macos-bundle.tar
          compression-level: 0
          if-no-files-found: error
      # The update archive alone, for `sign`, which then has nothing else of the build to unpack.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-update
          path: target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          compression-level: 0
          if-no-files-found: error

  # The daemon on its own for Linux, one archive per architecture, each built on a runner of its architecture: the UI,
  # then the release daemon embedding it for the musl target, linked statically, packed with the example systemd unit
  # and the license, with its SHA-256. `musl-gcc` compiles the C code of the dependencies for musl. `sign` signs the
  # archives from the artifacts.
  linux:
    needs: validate
    if: contains(needs.validate.outputs.platforms, 'linux')
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: rustup toolchain install
      - uses: ./.github/actions/rust-cache
        with:
          profile: linux-release
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: /usr/bin/time -v pnpm --filter @octoboard/desktop release --arch ${{ matrix.arch }} --no-sign-update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: target/linux-release/*
          if-no-files-found: error

  # The daemon's Linux lint and tests (`linux-daemon.yml`), for a release with Linux in it: the local checks before
  # tagging run on macOS and do not compile its Linux-only code. `sign`, and so the publishing, waits for them.
  linux-daemon:
    needs: validate
    if: contains(needs.validate.outputs.platforms, 'linux')
    uses: ./.github/workflows/linux-daemon.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  # Signs the update files the builds of the selected platforms uploaded: the macOS update archive, the Windows
  # installer, the Linux archives. It runs when `validate` succeeded and every selected platform's build and checks did:
  # a platform that was not selected leaves its jobs skipped, which must not stop it, and a failed one must. Windows is
  # built by `windows` or by the `signpath` route, which ends in `windows-signpath-finish`; the other one is skipped.
  # The update key comes from the `release-signing` environment, so its protection rules (required reviewers, the
  # refs that may use it) hold the signing until they are met; it reaches this job only as long as no repository secret
  # of the same name exists, which would stand in for a missing environment secret and be readable by any workflow. The
  # runner is a fresh one that runs nothing of the builds: their files are only read, the tag's checkout is only read
  # (the version and the product name), and the signer is the Tauri CLI pinned by `.github/signer/package-lock.json`
  # of this workflow's own commit (so that a tag made before it can be signed too), installed without install scripts.
  sign:
    needs: [validate, macos, windows, windows-signpath-finish, linux, linux-daemon]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success'
      && needs.macos.result == (contains(needs.validate.outputs.platforms, 'macos') && 'success' || 'skipped')
      && needs.windows.result == (contains(needs.validate.outputs.platforms, 'windows')
        && needs.validate.outputs.windows_signing != 'signpath' && 'success' || 'skipped')
      && needs.windows-signpath-finish.result == (contains(needs.validate.outputs.platforms, 'windows')
        && needs.validate.outputs.windows_signing == 'signpath' && 'success' || 'skipped')
      && needs.linux.result == (contains(needs.validate.outputs.platforms, 'linux') && 'success' || 'skipped')
      && needs.linux-daemon.result == (contains(needs.validate.outputs.platforms, 'linux') && 'success' || 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-signing
    steps:
      - name: Check the update key
        env:
          # Only whether the secret is set reaches the step, never its value.
          HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_TAURI_SIGNING_PRIVATE_KEY" != true ]; then
            echo "::error::The release-signing environment has no TAURI_SIGNING_PRIVATE_KEY secret (and no repository secret of that name, which should not exist). See the \"Releasing by tag\" section of apps/desktop/scripts/README.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: workflow
          sparse-checkout: .github/signer
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # `npm ci` installs exactly the lockfile, each package checked against its recorded integrity.
      - name: Install the signer
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix workflow/.github/signer
      - name: Download the macOS update archive
        if: contains(needs.validate.outputs.platforms, 'macos')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-update
          path: ${{ runner.temp }}/updates
      - name: Download the Windows installer
        if: contains(needs.validate.outputs.platforms, 'windows')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: ${{ runner.temp }}/updates
      - name: Download the Linux archives
        if: contains(needs.validate.outputs.platforms, 'linux')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: ${{ runner.temp }}/updates
      # Exactly this version's update files of the selected platforms are signed, by the names the build gives them
      # (`release-manifest.mjs`), and nothing else a build may have put beside them; a missing one fails here. Each
      # signature is bound to the version (`--app-version`) and names the file it was made for, which the daemon's
      # self-update checks. `publish` checks every signature against the public key before publishing.
      - name: Sign the updates
        env:
          PLATFORMS: ${{ needs.validate.outputs.platforms }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          product=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").productName')
          set --
          case ",$PLATFORMS," in
            *,macos,*) set -- "$@" "$product.app.tar.gz" ;;
          esac
          case ",$PLATFORMS," in
            *,windows,*) set -- "$@" "${product}_${version}_x64-setup.exe" ;;
          esac
          case ",$PLATFORMS," in
            *,linux,*) set -- "$@" "octoboardd_${version}_linux_x86_64.tar.gz" "octoboardd_${version}_linux_aarch64.tar.gz" ;;
          esac
          for name in "$@"; do
            if [ ! -f "$RUNNER_TEMP/updates/$name" ]; then
              echo "::error::The builds uploaded no $name to sign."
              exit 1
            fi
            workflow/.github/signer/node_modules/.bin/tauri signer sign --app-version "$version" "$RUNNER_TEMP/updates/$name"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-signatures
          path: ${{ runner.temp }}/updates/*.sig
          if-no-files-found: error

  # Publishes what the build jobs of the selected platforms uploaded, with the signatures `sign` made, once `sign` has
  # succeeded. The macOS tools that check the disk image are needed only with macOS in the release, so a publish without
  # macOS runs on Linux. Nothing here is built, and the update key is not given to it. It attests the build provenance
  # of the files it publishes too: here, because these are the exact bytes it uploads (the disk image reaches no other
  # job), and not in `sign`, so that the job holding the update key gains no further right.
  publish:
    needs: [validate, sign]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ${{ contains(needs.validate.outputs.platforms, 'macos') && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 30
    # `id-token` and `attestations` are for the provenance attestations alone.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PLATFORMS: ${{ needs.validate.outputs.platforms }}
    steps:
      # No credential stays in `.git/config`: `gh` takes its token from the environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # The publishing script uses Node's built-in modules only, so nothing is installed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Read the release notes
        run: sh .github/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Download the macOS build
        if: contains(needs.validate.outputs.platforms, 'macos')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-bundle
          path: ${{ runner.temp }}/macos
      - name: Unpack the macOS build
        if: contains(needs.validate.outputs.platforms, 'macos')
        run: |
          mkdir -p target/universal-apple-darwin/release
          tar -C target/universal-apple-darwin/release -xf "$RUNNER_TEMP/macos/macos-bundle.tar"
      - name: Download the Windows installer
        if: contains(needs.validate.outputs.platforms, 'windows')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: ${{ runner.temp }}/windows
      - name: Download the Linux archives
        if: contains(needs.validate.outputs.platforms, 'linux')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-signatures
          path: ${{ runner.temp }}/signatures
      # Each update file gets the signature `sign` made of the file of that name; a missing one fails here.
      - name: Place the signatures
        run: |
          place() {
            for file in "$@"; do
              [ -f "$file" ] || continue
              cp "$RUNNER_TEMP/signatures/$(basename "$file").sig" "$file.sig"
            done
          }
          case ",$PLATFORMS," in
            *,macos,*) place target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz ;;
          esac
          case ",$PLATFORMS," in
            *,windows,*) place "$RUNNER_TEMP"/windows/*-setup.exe ;;
          esac
          case ",$PLATFORMS," in
            *,linux,*) place "$RUNNER_TEMP"/linux/octoboardd_*.tar.gz ;;
          esac
      # The publishing's own checks (versions, notarization, the signatures against the public key, the SHA-256 files),
      # with nothing published yet, so that only files it accepts are attested.
      - name: Check the release
        run: |
          set --
          case ",$PLATFORMS," in
            *,windows,*) set -- "$@" --windows-dir "$RUNNER_TEMP/windows" ;;
          esac
          case ",$PLATFORMS," in
            *,linux,*) set -- "$@" --linux-dir "$RUNNER_TEMP/linux" ;;
          esac
          node apps/desktop/scripts/publish-release.mjs --notes-file "$RUNNER_TEMP/notes.md" --platforms "$PLATFORMS" "$@" --dry-run
      # Each selected platform's files are listed with `ls`, so that a missing one fails here: the attestation itself
      # fails only when no path matches at all. The list mirrors what `publish-release.mjs` uploads besides the `.sha256`
      # and `.sig` files (`releaseLayout` in `release-manifest.mjs`). The attestation names each file by its SHA-256,
      # which the published copy keeps whatever name it is published under.
      - name: List the files to attest
        id: subjects
        run: |
          {
            echo "paths<<EOF"
            case ",$PLATFORMS," in
              *,macos,*) ls target/universal-apple-darwin/release/bundle/dmg/*.dmg target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz ;;
            esac
            case ",$PLATFORMS," in
              *,windows,*) ls "$RUNNER_TEMP"/windows/*-setup.exe ;;
            esac
            case ",$PLATFORMS," in
              *,linux,*) ls "$RUNNER_TEMP"/linux/octoboardd_*.tar.gz ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # A build provenance attestation of each file, signed through the workflow's OIDC identity (Sigstore's public
      # instance, so it is logged publicly) and stored with the repository, so that anyone can check with
      # `gh attestation verify <file> --repo <owner>/<repo>` that the file was made by a run of this workflow in this
      # repository. The provenance names the run's ref: the tag for a tag push, but the branch it was started from for a
      # run by hand. It adds to the minisign signatures, which the updaters and the install script check, and replaces
      # nothing. Made before publishing, so that no file is published without one; an outage fails the job, which is
      # re-run.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set --
          case ",$PLATFORMS," in
            *,windows,*) set -- "$@" --windows-dir "$RUNNER_TEMP/windows" ;;
          esac
          case ",$PLATFORMS," in
            *,linux,*) set -- "$@" --linux-dir "$RUNNER_TEMP/linux" ;;
          esac
          node apps/desktop/scripts/publish-release.mjs --notes-file "$RUNNER_TEMP/notes.md" --platforms "$PLATFORMS" "$@"

  # The website links each platform's newest download, read from the manifests when it is generated, so it is generated
  # again now that they announce this version. A job of its own, so that only it holds the right to start a workflow and
  # its failure shows apart from the publishing: the release stays published, and the website's workflow is started by
  # hand.
  website:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Deploy the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main
