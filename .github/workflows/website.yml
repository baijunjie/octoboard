name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        id: pages
      # Pages reports an http origin until its certificate exists. The site is served over HTTPS.
      - id: site
        shell: bash
        run: |
          origin="${{ steps.pages.outputs.origin }}"
          printf 'origin=%s\n' "${origin/#http:/https:}" >> "$GITHUB_OUTPUT"
          base="${{ steps.pages.outputs.base_path }}"
          if [ -z "$base" ]; then
            base="/"
          fi
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @octoboard/web check:locales
      - run: pnpm --filter @octoboard/web typecheck
      - run: pnpm --filter @octoboard/web build
        env:
          NUXT_PUBLIC_SITE_ORIGIN: ${{ steps.site.outputs.origin }}
          NUXT_APP_BASE_URL: ${{ steps.site.outputs.base }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/web/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
