name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/configure-pages@v5
        id: pages
      # Pages reports an http origin until its certificate exists. The site is served over HTTPS.
      - id: site
        shell: bash
        run: |
          origin="${{ steps.pages.outputs.origin }}"
          printf 'origin=%s\n' "${origin/#http:/https:}" >> "$GITHUB_OUTPUT"
          base="${{ steps.pages.outputs.base_path }}"
          if [ -z "$base" ]; then
            base="/"
          fi
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @octoboard/web check:locales
      - run: pnpm --filter @octoboard/web typecheck
      - run: pnpm --filter @octoboard/web generate
        env:
          NUXT_PUBLIC_SITE_ORIGIN: ${{ steps.site.outputs.origin }}
          NUXT_APP_BASE_URL: ${{ steps.site.outputs.base }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
