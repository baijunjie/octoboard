name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      # Pages reports an http origin until its certificate exists. The site is served over HTTPS.
      - id: site
        shell: bash
        run: |
          origin="${{ steps.pages.outputs.origin }}"
          printf 'origin=%s\n' "${origin/#http:/https:}" >> "$GITHUB_OUTPUT"
          base="${{ steps.pages.outputs.base_path }}"
          if [ -z "$base" ]; then
            base="/"
          fi
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @octoboard/web check:locales
      - run: pnpm --filter @octoboard/web typecheck
      - run: pnpm --filter @octoboard/web build
        env:
          NUXT_PUBLIC_SITE_ORIGIN: ${{ steps.site.outputs.origin }}
          NUXT_APP_BASE_URL: ${{ steps.site.outputs.base }}
      # The tests read the build's output, so they run after it.
      - run: pnpm --filter @octoboard/web test
      - run: pnpm exec eslint apps/web --max-warnings 0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/.output/public
          # Dotfiles are left out by default, and the site ships a `.nojekyll`.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
