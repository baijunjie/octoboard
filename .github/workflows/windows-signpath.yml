name: Windows signing through SignPath

# The `signpath` route of the Windows release for one architecture, which `release.yml` calls once per architecture
# when the repository variable `WINDOWS_SIGNING` is `signpath`. A workflow of its own, called per architecture, because
# each job hands the next one an artifact's id through a job output, which the legs of a matrix job would overwrite.
# Every artifact's name ends in the architecture, so the two calls of one run keep theirs apart; the last job uploads
# the signed installer as `windows-installer-<arch>`, which `release.yml`'s `sign` and `publish` jobs take.
on:
  workflow_call:
    inputs:
      ref:
        description: "The ref to build, such as refs/tags/desktop-v0.1.0"
        required: true
        type: string
      arch:
        description: "The architecture, as the installer's name carries it: x64 or arm64"
        required: true
        type: string
      target:
        description: "The architecture's Rust target, such as aarch64-pc-windows-msvc"
        required: true
        type: string
    secrets:
      SIGNPATH_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  # `signpath`: SignPath signs only uploaded artifacts, and each of its two requests waits for an approval given by
  # hand, which can take longer than the six hours a GitHub-hosted job may run. So the route is five jobs, each well
  # under that, passing artifacts on: build the executables, have SignPath sign them, bundle the installer from them,
  # have SignPath sign that, then finish it (`sign` signs the update, as for the other routes). The waits run on Linux,
  # where nothing is built. The bundling job builds the tree the bundler reads again, from the same commit, rather than
  # carrying it over: the signed executables then replace the ones it built.
  windows-signpath-build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      WINDOWS_SIGNING: signpath
    defaults:
      run:
        shell: bash
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: rustup toolchain install
      - uses: ./.github/actions/rust-cache
        with:
          profile: windows-release-${{ inputs.arch }}
      - run: pnpm install --frozen-lockfile
      - name: Build the executables
        run: pnpm --filter @octoboard/desktop release --arch ${{ inputs.arch }} --stage build --no-sign-update
      - name: Upload the executables
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-binaries-${{ inputs.arch }}
          path: target/signpath/binaries/*
          if-no-files-found: error

  # The request's wait is capped at four hours (`wait-for-completion-timeout-in-seconds`), inside the job's own limit.
  # SignPath reads the artifact and this run's details with the job's token, hence `actions: read`.
  windows-signpath-sign-binaries:
    needs: windows-signpath-build
    runs-on: ubuntu-latest
    timeout-minutes: 270
    permissions:
      contents: read
      actions: read
    steps:
      - name: Sign the executables
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_BINARIES_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.windows-signpath-build.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed-binaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-binaries-${{ inputs.arch }}
          path: signed-binaries/*
          if-no-files-found: error

  # Builds the tree again and bundles the installer from the signed executables. The installer goes to SignPath as
  # `unsigned-installer`, and once more under the name the bundler gave it, which the finishing job puts the signed
  # one under.
  windows-signpath-bundle:
    needs: windows-signpath-sign-binaries
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      WINDOWS_SIGNING: signpath
    defaults:
      run:
        shell: bash
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: rustup toolchain install
      - uses: ./.github/actions/rust-cache
        with:
          profile: windows-release-${{ inputs.arch }}
      - run: pnpm install --frozen-lockfile
      - name: Build the executables again
        run: pnpm --filter @octoboard/desktop release --arch ${{ inputs.arch }} --stage build --no-sign-update
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-binaries-${{ inputs.arch }}
          path: target/signpath/signed-binaries
      - name: Bundle the installer
        run: pnpm --filter @octoboard/desktop release --arch ${{ inputs.arch }} --stage bundle --signed target/signpath/signed-binaries --no-sign-update
      - name: Upload the installer
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer-${{ inputs.arch }}
          path: target/signpath/installer/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-nsis-${{ inputs.arch }}
          path: target/${{ inputs.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  windows-signpath-sign-installer:
    needs: windows-signpath-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 270
    permissions:
      contents: read
      actions: read
    steps:
      - name: Sign the installer
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.windows-signpath-bundle.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed-installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-installer-${{ inputs.arch }}
          path: signed-installer/*
          if-no-files-found: error

  # Puts the signed installer in the bundle directory under the bundler's name and checks it against the ConPTY files
  # fetched again.
  windows-signpath-finish:
    needs: windows-signpath-sign-installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_SIGNING: signpath
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the ConPTY files the installer is checked against
        run: node scripts/fetch-conpty.mjs --installer --arch ${{ inputs.arch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-nsis-${{ inputs.arch }}
          path: target/${{ inputs.target }}/release/bundle/nsis
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-installer-${{ inputs.arch }}
          path: target/signpath/signed-installer
      - name: Finish the installer
        run: pnpm --filter @octoboard/desktop release --arch ${{ inputs.arch }} --stage finish --signed target/signpath/signed-installer --no-sign-update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-${{ inputs.arch }}
          path: target/${{ inputs.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
