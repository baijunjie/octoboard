name: Code quality

# Application checks run unconditionally before releases and on request. Website and gallery-only
# checks belong to local scoped push verification, not the desktop release gate.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A run started by hand replaces an earlier one started by hand on the same ref, whose result it supersedes. A run
# that a release calls sees the caller's workflow name, so it is grouped apart and never cancelled.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'Code quality' && github.event_name == 'workflow_dispatch' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the application frontend
        run: /usr/bin/time -v pnpm verify --release --release-group frontend --fresh

  native:
    # Desktop script tests include macOS-only archive checks; both Rust crates build against macOS frameworks.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      # rustup is preinstalled; this installs the toolchain `rust-toolchain.toml` pins.
      - run: rustup toolchain install
      - uses: ./.github/actions/rust-cache
        with:
          profile: checks
      - run: pnpm install --frozen-lockfile
      - name: Check the desktop scripts and Rust workspace
        run: /usr/bin/time -l pnpm verify --release --release-group native --fresh

  linux-check:
    # The desktop shell gates its macOS-only code, and the daemon is meant to run on Linux; the macOS
    # job above cannot notice either one breaking, so this compiles both crates there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tauri 2's Linux prerequisites.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # rustup is preinstalled; this installs the toolchain `rust-toolchain.toml` pins.
      - run: rustup toolchain install
      - uses: ./.github/actions/rust-cache
        with:
          profile: linux-check
      # `scripts/cargo.mjs` empties the sidecar list `tauri-build` insists on; compiling never starts it.
      - run: /usr/bin/time -v node scripts/cargo.mjs check --locked
