name: Code quality

# Application checks run unconditionally before releases and on request. Website and gallery-only
# checks belong to local scoped push verification, not the desktop release gate.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    # macOS, like the release build: the desktop crate's tests build against macOS frameworks.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      # rustup is preinstalled; this installs the toolchain `rust-toolchain.toml` pins.
      - run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify --release --fresh

  linux-check:
    # The desktop shell gates its macOS-only code, and the daemon is meant to run on Linux; the macOS
    # job above cannot notice either one breaking, so this compiles both crates there.
    runs-on: ubuntu-latest
    env:
      # `tauri-build` refuses to build without the sidecar `bundle.externalBin` names; compiling
      # never starts it, so this empties the list like `scripts/test-rust.mjs` does.
      TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Tauri 2's Linux prerequisites.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # rustup is preinstalled; this installs the toolchain `rust-toolchain.toml` pins.
      - run: rustup toolchain install
      - run: cargo check --workspace --all-targets --locked
