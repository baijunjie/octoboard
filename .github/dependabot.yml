# Automatic version update PRs are disabled; action versions are maintained manually.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
    groups:
      # Major versions come one by one, so one that needs changes does not hold back the rest.
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
