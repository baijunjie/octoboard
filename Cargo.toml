# The repository's Rust crates build as one workspace: one lockfile and one build directory, so a
# dependency both crates share compiles once and resolves to a single version.
#
# A virtual manifest does not inherit the dependency resolver from its members' editions, so the
# resolver is set here explicitly; without it cargo falls back to the 2015-era resolver and warns.
[workspace]
resolver = "2"
members = ["apps/daemon", "apps/desktop/src-tauri"]

# `rust-version` matches the toolchain pinned in `rust-toolchain.toml`: the project is built and
# checked on that one release only, so it claims no older one.
[workspace.package]
authors = ["BaiJunjie"]
license = "MIT"
repository = "https://github.com/baijunjie/octoboard"
edition = "2021"
rust-version = "1.99"

# Debug information is what makes a debug build's target directory and link time large, and the
# crates under `[workspace]` are the only code a developer steps through, so the dependencies are
# built without it. Panic backtraces of the workspace crates keep their line numbers.
[profile.dev.package."*"]
debug = false
