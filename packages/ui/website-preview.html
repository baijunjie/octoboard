<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- The real App runs on in-memory fixtures. No network or native capability is available. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>%APP_NAME% product preview</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Keeps `#root` from ever being the last child of `<body>`: overlays are portalled to the end of
      `<body>`, and each one mounting or unmounting would otherwise flip whether `#root` matches
      `:last-child`, which WebKit answers by recalculating the style of the whole application. The
      module script below is no such sibling: the build moves it into `<head>`.
    -->
    <div hidden></div>
    <script type="module" src="./src/website-preview/main.tsx"></script>
  </body>
</html>
