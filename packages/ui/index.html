<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      This UI's Content Security Policy, and the only one it ships. It is delivered here rather
      than through `app.security.csp` in the desktop shell's `src-tauri/tauri.conf.json` for two
      reasons: that policy is attached as a response header by Tauri's `tauri://` asset handler,
      which serves nothing under `tauri dev` (the window loads the Vite dev server over plain
      http instead), so it would not apply in development at all; and whenever a policy is
      configured there, Tauri appends a `'sha256-...'` source per bundled script to `script-src`,
      and a hash source makes `'unsafe-inline'` inert (CSP Level 3), which would block this page's
      inline bootstrap script and the UI's inline styles (and the dev server's inline Refresh preamble) in
      whichever build carries a hash, while they work in the other. Delivered as `<meta>`,
      one policy applies byte for byte in both, and in a plain browser too, so what is verified in
      development is what ships.
      Do not configure `app.security.csp` as well: the two policies are enforced as an
      intersection, and Tauri's hash injection into the second one would break the page.

      This tag has to stay ahead of the module script below — a `<meta>` policy only covers what
      the parser reaches after it.

      What each directive is for:

      - `default-src 'none'`: nothing loads unless named below. The UI's assets and the remote
        images a Markdown document names are admitted explicitly; anything new the UI starts
        loading has to be added here deliberately.
      - `frame-src 'none'`: the UI embeds no frame, so nothing it draws, a report page's content
        included, can load one or navigate to one to send data out.
      - `script-src`/`style-src 'unsafe-inline'`: required by this page's own inline bootstrap
        script below (the one that applies the theme class before paint) and by the inline styles
        the UI's components set, and in development by the inline React Refresh preamble. No nonce or
        hash source may ever be added to these two directives: either one makes `'unsafe-inline'`
        inert, which would block all three.
      - `font-src 'self'`: KaTeX's stylesheet refers to its own font files, which Vite serves
        from this origin. A formula's glyphs are drawn from those fonts; without this directive
        the request is refused (`default-src` is `'none'`) and the formula is not readable.
        The fonts are the only thing this directive admits.
      - `img-src data: http: https:`: for a Markdown document's project images (`data:` URLs) and
        HTTP(S) images, and for the menu bar icon's SVG `data:` pictures (`statusItemIcons.ts`). A
        report page's Markdown is drawn in the renderer's `untrusted` mode, which draws an image
        from a `data:` address only, so a page's content never makes a request this admits.
      - `connect-src`: `'self'` is the daemon when it serves this UI, and the dev server's proxy
        to one (the page then reaches `/ws/...` on its own origin; per CSP3, `'self'` covers the
        `ws:`/`wss:` scheme matching the page's `http:`/`https:`). Otherwise the daemon binds an
        OS-assigned loopback port per run, so its port can only be matched by a wildcard. `ipc:`
        is the scheme Tauri's own `invoke` fetches on macOS, and without it every call falls back
        to its slower `postMessage` path. `ws://localhost:*` is
        the Vite dev server's hot-reload socket, which matches nothing in a packaged build — it is
        the one source here that exists only for development. Per CSP3 scheme-part matching, a
        `ws:` source expression also matches `http:`/`https:` URLs on the same host, so
        `ws://127.0.0.1:*` already covers the one `http://127.0.0.1:*` URL the app ever builds
        (`ws://127.0.0.1:${port}` in `packages/ui/src/daemon.ts`) without a separate entry, and
        `ws://localhost:*` grants plain `http` to any localhost port by that same rule — harmless
        here since nothing in `packages/ui/src` ever issues a `fetch`, `XMLHttpRequest`,
        `EventSource`, or `sendBeacon` call.
      - `worker-src 'self'`: a report page's text field `pattern` is tested in a Web Worker
        (`src/report/page/patternWorker.ts`), as the pattern is the agent's and must never run on the
        window's own thread. The worker's script is served from this origin, which is all this
        admits. `script-src` would admit it as a fallback; the directive is spelled out so the
        worker's admission does not ride on that fallback.
      - `form-action`/`base-uri 'none'`: neither falls back to `default-src`, so both are spelled
        out rather than left open.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data: http: https:; connect-src 'self' ipc: ws://127.0.0.1:* ws://localhost:*; frame-src 'none'; worker-src 'self'; form-action 'none'; base-uri 'none'"
    />
    <!--
      The page's address carries the daemon's key (`?key=`, see `src/daemon.ts`), which must not leave
      the page in a `Referer` header.
    -->
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%APP_NAME%</title>
    <script>
      // Avoids a light flash on load in dark mode. HeroUI's light variables are the `:root`
      // default, and `useTheme` (src/preferences/theme.tsx) only applies the dark class from a React layout
      // effect, after the module script below has loaded and run — too late to stop the first
      // paint from being light. This duplicates that hook's own resolution (same localStorage key,
      // same `matchMedia` fallback, same class + `data-theme` pair) deliberately, so it can run
      // before any of that: a plain inline script is already in the parser's way by the time it
      // reaches this point, with nothing to wait on. Keep this in sync with `useTheme`'s
      // behaviour (`@heroui/react`) if that ever changes.
      //
      // Also records the unresolved choice, as `data-theme-choice`, not just the resolved theme:
      // `main.tsx` needs both before it has rendered anything to read them from — the resolved
      // value for the class it already applies to a `<body>` that paints before React runs, and
      // the raw choice to tell a `"system"` user apart from one who explicitly chose today's OS
      // appearance, which is what decides whether it pushes `null` or a concrete value onto the
      // native window's own theme (see `index.ts`'s `NativeWindowCapability.setTheme`). Reading
      // these two attributes back is `main.tsx`'s only use of this resolution; it must not
      // re-derive it from `localStorage` itself, which would make this a third place doing the
      // same resolution rather than the one place the other two already defer to.
      (function () {
        var stored = localStorage.getItem("heroui-theme");
        var choice = stored === "light" || stored === "dark" ? stored : "system";
        var theme =
          choice === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : choice;
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.setAttribute("data-theme-choice", choice);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Keeps `#root` from ever being the last child of `<body>`. Every overlay (menu, popover, tooltip,
      dialog) is portalled to the end of `<body>`, and while `#root` is the last child, each one
      mounting or unmounting changes whether `#root` matches `:last-child`. Utilities such as
      `space-y-*` and `divide-y` select on `:not(:last-child)`, so the browser answers that change by
      recalculating the style of the whole application, which WebKit takes tens of milliseconds
      over. With this element after it, an overlay only ever changes this element's position. The
      module script below is no such sibling: the build moves it into `<head>`.
    -->
    <div hidden></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
