<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The shell of the dev-only UI state gallery (see `src/gallery/`): a list of scenarios and the
      controls around an iframe that renders the chosen one (`gallery-frame.html`). Not part of the
      build: `vite build` bundles `index.html` alone. Open it at `/gallery.html` on the dev server.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src ws://localhost:* ws://127.0.0.1:*; frame-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%APP_NAME% gallery</title>
    <style>
      :root { color-scheme: light dark; font: 13px/1.4 system-ui, sans-serif; }
      body { margin: 0; height: 100vh; display: flex; }
      nav { width: 260px; flex: none; overflow-y: auto; padding: 8px 0; border-inline-end: 1px solid #8884; }
      nav section + section { margin-top: 4px; border-top: 1px solid #8884; }
      nav h2 { display: flex; align-items: center; gap: 6px; margin: 0; padding: 10px 12px 4px; font-size: 12px; font-weight: 600; }
      nav h2 svg { flex: none; color: #2563eb; }
      nav h3 { display: flex; justify-content: space-between; margin: 8px 12px 3px 32px; font-size: 11px; font-weight: 600; }
      nav h3 span { opacity: 0.6; font-weight: 400; }
      .category-section[data-category="normal"] h3 { color: light-dark(#15803d, #4ade80); }
      .category-section[data-category="normal"] h3 span { opacity: 1; }
      .category-section[data-category="exceptional"] h3 { color: #b45309; }
      .no-scenarios { margin: 0 12px 5px 32px; font-size: 11px; opacity: 0.55; }
      .preview-context { padding: 12px; border-bottom: 1px solid #8884; }
      .preview-location { font-size: 12px; display: flex; align-items: center; gap: 8px; }
      .category-badge { padding: 2px 7px; border-radius: 4px; background: #16a34a1c; color: light-dark(#15803d, #4ade80); }
      .preview-context[data-category="exceptional"] .category-badge { background: #d9770620; color: #b45309; }
      .preview-context h1 { margin: 6px 0; font-size: 17px; }
      .preview-context p { margin: 4px 0 0; }
      .preview-context > p:first-of-type { font-size: 12px; opacity: 0.7; }
      nav a { display: block; padding: 3px 12px 3px 32px; color: inherit; text-decoration: none; }
      nav a:hover { background: #8882; }
      nav a[aria-current] { background: #2563eb; color: #fff; }
      main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 12px; border-bottom: 1px solid #8884; }
      header .group { display: flex; align-items: center; gap: 4px; }
      header button, header select, header input { font: inherit; }
      header button[aria-pressed="true"] { background: #2563eb; color: #fff; border-color: #2563eb; }
      header input[type="number"] { width: 6ch; }
      .description { opacity: 0.8; }
      .stage { flex: 1; min-height: 0; overflow: auto; background: #8882; padding: 12px; }
      iframe { display: block; height: 100%; min-height: 400px; border: 1px solid #8886; background: Canvas; }
    </style>
  </head>
  <body>
    <div id="root" style="display: contents"></div>
    <script type="module" src="./src/gallery/shell.tsx"></script>
  </body>
</html>
