[package]
name = "obd-proto-shell"
version = "0.1.0"
description = "Throwaway Tauri 2 shell for octoboard milestone 00 (technical validation). Not a real product crate — see prototype/README.md."
authors = ["Junjie Bai"]
license = "MIT"
repository = "https://github.com/baijunjie/octoboard"
edition = "2021"
rust-version = "1.86"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-shell = "=2.0.2"
anyhow = "1"
# Pinned explicitly, not just transitively through `tauri`/`tauri-build`/`tauri-plugin-shell`
# above: left unpinned, cargo resolves each of these to its newest 2.x/3.x release regardless
# of the pins above, and recent releases need a newer rustc than this machine has (1.86 — see
# the daemon crate's sibling note about the same MSRV friction with reqwest/idna/ICU). These are
# each that crate's own last release whose declared rust-version is <= 1.86.
tauri-runtime = "=2.11.3"
tauri-utils = "=2.9.3"
tauri-macros = "=2.6.3"
tauri-codegen = "=2.6.3"
tauri-plugin = "=2.6.3"
tauri-runtime-wry = "=2.11.4"
# Same story one layer further down: these crates' own rust-version bumped past 1.86 in the
# versions cargo would otherwise pick.
darling = "=0.21.3"
encoding_rs = "=0.8.35"
icu_collections = "=2.2.0"
icu_locale_core = "=2.2.0"
icu_normalizer = "=2.2.0"
icu_normalizer_data = "=2.2.0"
icu_properties = "=2.2.0"
icu_properties_data = "=2.2.0"
icu_provider = "=2.2.0"
plist = "=1.8.0"
serde_with = "=3.17.0"
time = "=0.3.45"
