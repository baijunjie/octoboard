[package]
name = "obd-proto"
version = "0.1.0"
edition = "2021"
publish = false

# Throwaway validation prototype (milestone 00). Not a real product crate — see
# prototype/README.md. No backward-compatibility obligation.

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
